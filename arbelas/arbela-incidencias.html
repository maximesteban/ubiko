<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbela - Incidencias</title>
    <link rel="stylesheet" href="../css/arbela.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="wrap">
          <div class="title">Incidencias</div>
          <div class="subtitle">Reporta, gestiona y haz seguimiento</div>
        </div>
        <div class="brand-accent"></div>
      </header>

      <main class="wrap stack-lg">
        <div class="row">
          <a class="btn btn-primary" href="arbela-incidencia-nueva.html">Reportar incidencia</a>
        </div>

        <div class="filters">
          <button class="btn active">Abiertas</button>
          <button class="btn">En proceso</button>
          <button class="btn">Resueltas</button>
        </div>

        <div class="list">
          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Fuga en cuarto de contadores</div>
                <div class="card-meta">Ref. INC-1024 · Reportada: 14/09/2024</div>
              </div>
              <span class="badge warning">En proceso</span>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Ver detalle</a>
              <a class="btn btn-outline" href="#">Añadir comentario</a>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Luces garaje bloque B</div>
                <div class="card-meta">Ref. INC-0988 · Reportada: 02/09/2024</div>
              </div>
              <span class="badge success">Resuelta</span>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Ver detalle</a>
              <a class="btn btn-outline" href="#">Valorar</a>
            </div>
          </div>
        </div>
      </main>

.    </div>
  </body>
  </html>
