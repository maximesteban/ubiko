<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbela - Mis Facturas</title>
    <link rel="stylesheet" href="../css/arbela.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="wrap">
          <div class="title">Mis Facturas</div>
          <div class="subtitle">Resumen y descargas</div>
        </div>
        <div class="brand-accent"></div>
      </header>

      <main class="wrap stack-lg">
        <div class="filters">
          <button class="btn">Pendientes</button>
          <button class="btn">Pagadas</button>
          <button class="btn active">Todas</button>
        </div>

        <div class="list">
          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Factura 2024-INV-034</div>
                <div class="card-meta">Fecha: 08/09/2024 · Periodo: Ago 2024</div>
              </div>
              <div class="stack" style="align-items:flex-end">
                <div class="pill gold">€ 186,40</div>
                <span class="badge warning">Pendiente</span>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Descargar PDF</a>
              <a class="btn btn-outline" href="#">Ver detalles</a>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Factura 2024-INV-021</div>
                <div class="card-meta">Fecha: 08/06/2024 · Periodo: May 2024</div>
              </div>
              <div class="stack" style="align-items:flex-end">
                <div class="pill gold">€ 186,40</div>
                <span class="badge success">Pagada</span>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Descargar PDF</a>
              <a class="btn btn-outline" href="#">Ver detalles</a>
            </div>
          </div>
        </div>
      </main>

.    </div>
  </body>
  </html>
