<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbela - Mis Recibos</title>
    <link rel="stylesheet" href="../css/arbela.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="wrap">
          <div class="title">Mis Recibos</div>
          <div class="subtitle">Pagos periódicos de comunidad</div>
        </div>
        <div class="brand-accent"></div>
      </header>

      <main class="wrap stack-lg">
        <div class="filters">
          <button class="btn">Pendientes</button>
          <button class="btn">Pagados</button>
          <button class="btn active">Todos</button>
        </div>

        <div class="list">
          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Recibo Septiembre 2024</div>
                <div class="card-meta">Generado: 05/09/2024 · Método: Domiciliado</div>
              </div>
              <div class="stack" style="align-items:flex-end">
                <div class="pill gold">€ 155,00</div>
                <span class="badge success">Pagado</span>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Descargar</a>
              <a class="btn btn-outline" href="#">Justificante</a>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="stack">
                <div class="card-title">Recibo Agosto 2024</div>
                <div class="card-meta">Generado: 05/08/2024 · Método: Domiciliado</div>
              </div>
              <div class="stack" style="align-items:flex-end">
                <div class="pill gold">€ 155,00</div>
                <span class="badge success">Pagado</span>
              </div>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="btn" href="#">Descargar</a>
              <a class="btn btn-outline" href="#">Justificante</a>
            </div>
          </div>
        </div>
      </main>

.    </div>
  </body>
  </html>
