<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbela - Directorio Local</title>
    <link rel="stylesheet" href="../css/arbela.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="wrap">
          <div class="title">Directorio local</div>
          <div class="subtitle">Estilo de vida: selección de servicios</div>
        </div>
        <div class="brand-accent"></div>
      </header>

      <main class="wrap stack-lg">
        <div class="cards">
          <div class="card">
            <div class="card-title">Restaurante Terra</div>
            <div class="card-meta">Mediterráneo · 600 m</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">Web</a>
              <a class="btn" href="#">Reservar</a>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Wellness Arbela</div>
            <div class="card-meta">Spa & gym · 450 m</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">Llamar</a>
              <a class="btn btn-outline" href="#">Ver mapa</a>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Limpieza Premium</div>
            <div class="card-meta">Hogar · Servicios a medida</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">WhatsApp</a>
              <a class="btn btn-outline" href="#">Tarifas</a>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Cuidado de Mascotas</div>
            <div class="card-meta">Paseos y guardería</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">Llamar</a>
              <a class="btn btn-outline" href="#">Pedir cita</a>
            </div>
          </div>
        </div>
      </main>

    </div>
  </body>
  </html>
