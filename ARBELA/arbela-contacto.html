<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbela - Contacto</title>
    <link rel="stylesheet" href="../css/arbela.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="wrap">
          <div class="title">Contacto</div>
          <div class="subtitle">Mantenimiento, gestor y emergencias</div>
        </div>
        <div class="brand-accent"></div>
      </header>

      <main class="wrap stack-lg">
        <div class="cards">
          <div class="card">
            <div class="card-title">Administrador de Fincas</div>
            <div class="card-meta">Lunes a Viernes · 9:00 — 18:00</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">Llamar</a>
              <a class="btn" href="#">WhatsApp</a>
              <a class="btn btn-outline" href="#">Email</a>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Mantenimiento</div>
            <div class="card-meta">Incidencias técnicas y zonas comunes</div>
            <div class="row" style="margin-top:10px">
              <a class="btn" href="#">Llamar</a>
              <a class="btn btn-outline" href="#">Crear incidencia</a>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Emergencias 24/7</div>
            <div class="card-meta">Sólo urgencias · Atención inmediata</div>
            <div class="row" style="margin-top:10px">
              <a class="btn btn-primary" href="#">Llamar ahora</a>
            </div>
          </div>
        </div>
      </main>

.    </div>
  </body>
  </html>
